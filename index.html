<!DOCTYPE html>
<html lang="en">
<head> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZIVO | Eleven Pearl</title>

<style> 
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:80px;
    background:#ffffff;
    font-family:Arial, sans-serif;
}

.logo-card{
    cursor:pointer;
    transition:transform 0.2s ease;
}
.logo-card-ep{
    height:270px;
    width:190px;

}
.logo-card-ep{
    cursor:pointer;
    transition:transform 0.2s ease;
}
.logo-card:hover{
    transform:scale(1.05);
}
.logo-card-ep:hover{
    transform:scale(1.05);
}
.logo-card img{
    max-width:250px;
    width:100%;
    height:auto;
}
</style>
</head>

<body>

<div class="logo-card" onclick="location.href='zivo.html'">
    <img src="ZIVO ICON.png" alt="ZIVO">
</div>

<div class="logo-card-ep" onclick="location.href='EP.html'">
    <img class="logo-card-ep" src="EP LOGO.png" alt="Eleven Pearl">
</div>


</body>
</html>
